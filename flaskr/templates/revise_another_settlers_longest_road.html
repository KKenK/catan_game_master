{% extends "layout.html" %}

    {% block body %}
        <header>
            <h1>Update Another Settlers Longest Road!</h1>
        </header>
        
        <main>
            {% for settler in settlers_minus_current_settler %}
                <form action="update_another_settlers_longest_road" method="post">

                    <div>
                        <label for="{{settler.id}}">{{settler.username}} current longest road: </label>
                        <input type="hidden" name= "settler_id" value="{{settler.id}}">
                        <input type = "number" name = "{{settler.id}}" id = "{{settler.id}}" value = "{{settler.longest_road}}" min = "1">
                        <button type ="submit">Update</button>
                    </div>
                </form>
            {% endfor %}
         <a href = "./">Return</a>
        </main>
    {% endblock %}
