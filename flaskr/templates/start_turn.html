{% extends "layout.html" %}

    {% block body %}
        <header>
            <h1>{{settler_username}}'s Turn!</h1>
        </header>
				
				<main>
    		{% if not is_settler_two %}
						<form action="/game/collect_resources" method ="post">
            	  	<div>
            		    <label for="red">Enter Red Dice Roll:</label>
                  		<input type="number" id="red" name="red" min="2" max="12">
            		</div>
					<div>
            		    <label for="white">Enter White Dice Roll:</label>
                  		<input type="number" id="white" name="white" min="2" max="12">
            		</div>
		      	  	<div>
            		    <label for="event">Enter Event Dice Roll:</label>
                  		<select id="event" name="event">
							<option value="barbarian_ship">Barbarian Ship</option>
							<option value="trade">Trade</option>
							<option value="politics">Politics</option>
							<option value="science">Science</option>
						</select>
            		</div>
              	<div>
	                  <button type="submit">Enter</button>
              	</div>
          	</form>
        {% else %}
          	<a href="/game">Proceed</a>
    		{% endif %}
        </main>
		{% endblock %}
