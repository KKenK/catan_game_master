{% extends "layout.html" %}

    {% block body %}
        <header>
            <h1>{{current_settler_username}} Select City Improvement!</h1>
        </header>
        
        <main>
            <form action="update_city_improvement" method = "post">
                <table>
                    <thead>
                        <tr>
                            <th>Select</th>
                            <th>City Improvement</th>
                            <th>Level</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <input type="radio" name="city_improvement" value="{{settler.trade}}" required> 
                            </td>
                            <td>Trade</td>    
                            <td>{{settler.trade}}</td>
                        </tr>
                        <tr>
                            <td>
                                <input type="radio" name="city_improvement" value="{{settler.politics}}" required> 
                            </td>
                            <td>Politics</td>    
                            <td>{{settler.politics}}</td>
                        </tr>
                        <tr>
                            <td>
                                <input type="radio" name="city_improvement" value="{{settler.science}}" required> 
                            </td>
                            <td>Science</td>    
                            <td>{{settler.science}}</td>
                        </tr>
                    </tbody>
                </table>
                <button type="submit">Upgrade!</button>
            </form>
            <a href = "./">Return</a>
        </main>
    {% endblock %}
